pid /tmp/mlatho-local-prod/nginx/nginx.pid;
error_log /tmp/mlatho-local-prod/logs/nginx-error.log;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log /tmp/mlatho-local-prod/logs/nginx-access.log;
    client_body_temp_path /tmp/mlatho-local-prod/nginx/body;
    proxy_temp_path /tmp/mlatho-local-prod/nginx/proxy;
    fastcgi_temp_path /tmp/mlatho-local-prod/nginx/fastcgi;
    uwsgi_temp_path /tmp/mlatho-local-prod/nginx/uwsgi;
    scgi_temp_path /tmp/mlatho-local-prod/nginx/scgi;
    server {
        listen 127.0.0.1:8443 ssl;
        server_name localhost;
        ssl_certificate /tmp/mlatho-local-prod/nginx/cert.pem;
        ssl_certificate_key /tmp/mlatho-local-prod/nginx/key.pem;
        root /tmp/mlatho-local-prod/nginx/html;
        location /api/ {
            proxy_pass http://127.0.0.1:18000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        location /front { try_files $uri $uri/ /front/index.html; }
        location / { return 302 https://localhost:8443/front/; }
    }
}
